<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusWatch - Login</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <div class="user-login-page">

        <!-- Left side -->

        <div class="user-login-brand">

            <div class="user-brand-content">

                <div class="brand-logo">
                    CW
                </div>

                <h1>
                    Campus<span>Watch</span>
                </h1>

                <p>
                    Campus Monitoring Platform
                </p>

                <div class="user-brand-features">

                    <div>
                        ✓ Live System Monitoring
                    </div>

                    <div>
                        ✓ System Health
                    </div>

                    <div>
                        ✓ User Sessions
                    </div>

                    <div>
                        ✓ Issue Management
                    </div>

                </div>

            </div>

        </div>


        <!-- Right side -->

        <div class="user-login-form-container">

            <div class="user-login-form">

                <div class="login-icon">
                    👤
                </div>

                <h2>
                    Welcome Back
                </h2>

                <p class="login-description">
                    Login to your CampusWatch account.
                </p>


                <form id="userLoginForm">

                    <!-- Email -->

                    <div class="form-group">

                        <label for="userEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="userEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="userPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="userPassword"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <!-- Login button -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Login
                    </button>

                </form>


                <div class="login-footer">

                    <p>
                        Are you an administrator?
                    </p>

                    <a href="admin-login.html">
                        Administrator Portal
                    </a>

                </div>

                <div class="login-footer">

        Don't have an account?
        <a href="register.html">
            Create an account
        </a>
    </p>

</div>


                <div class="back-home">

                    <a href="../index.html">
                        ← Back to CampusWatch
                    </a>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/app.js"></script>

</body>

</html>
